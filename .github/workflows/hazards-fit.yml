# The fit of the laws of the duration of outages from EAGLE-I (CC BY 4.0). A person starts it:
#   gh workflow run hazards-fit.yml -f years=2014-2025
# The job reads about 13 GB from figshare in range requests through polite-crawler. It examines the MD5 of each file.
# It uploads the curve of each state as the artifact eaglei-laws, and the summary of the run has a table of the curves.
name: hazards-fit

on:
  workflow_dispatch:
    inputs:
      years:
        description: The years to read, as one year (2024) or a range (2014-2025)
        type: string
        default: "2014-2030"
      share:
        description: The share of the customers of a county that starts an event (empty for the default)
        type: string
        default: ""
      join:
        description: The join time in seconds of near runs of one county into one event (empty for 0, no join)
        type: string
        default: ""
      sweep:
        description: Also count the events with each join time of the sweep (0, 1, 4, 12 and 24 hours)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hazards-fit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  eaglei:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fit the laws
        env:
          YEARS: ${{ inputs.years }}
          SHARE: ${{ inputs.share }}
          JOIN: ${{ inputs.join }}
          SWEEP: ${{ inputs.sweep }}
        run: |
          args=(--years "$YEARS" --out out/eaglei-laws.json)
          if [ -n "$SHARE" ]; then args+=(--share "$SHARE"); fi
          if [ -n "$JOIN" ]; then args+=(--join "$JOIN"); fi
          if [ "$SWEEP" = "true" ]; then args+=(--sweep); fi
          node packages/stack-hazards/scripts/eaglei-fit.ts "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eaglei-laws
          path: out/eaglei-laws.json
          retention-days: 90
          if-no-files-found: error
