# The cost of independentStop of stack-endurance at 4, 8, 12 and 14 cuts (packages/stack-endurance/bench/README.md).
# Each job times each case in fresh child processes with the A/A arm of 12 cuts, and uploads its raw records.
# The job read reads the records of all jobs: the value of each case, the gate against bench/limits.json, and
# the candidate limits of these jobs (runLimit: the worst value of 5 runs or more plus their spread).
# A noisy job, a CPU model with no frozen value and a missing case are a no read. A no read is not a pass.
name: Bench

on:
  # A person starts a run: gh workflow run bench.yml --ref <branch>
  workflow_dispatch:
    inputs:
      gate:
        description: "The gate decides the run. With false, the run only reports."
        type: boolean
        default: true
  # Each pull request starts the workflow. The job changes skips the bench when the pull request changes only text files (CI.md, "A gate with paths").
  # Then the job timed compares the stamp of the timed code at the head and at the merge base (the shared action stamp-gate, with bench/stamp.json). The bench runs only when they differ.
  pull_request:

permissions:
  contents: read

# The runner budget of the account: a new run does not stop a run that times, because its records are paid data.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      # A dispatched run on the branch of a pull request gives that pull request to changes
      - if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - id: pull
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: mark1russell7/template/.github/actions/pull-of-run@7c83f30551e066c06852ea75bf0140eadfc49961 # main
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          pull-request: ${{ steps.pull.outputs.found == 'true' && steps.pull.outputs.number || '' }}
          # A coarse filter only: the job timed decides from the stamp, so this list names no source file.
          paths: |
            **
            !**/*.md
            packages/stack-endurance/bench/**

  # The stamp of the timed code: the bundle of bench/child.ts after a tree shake, with the lock closure of each package that it imports.
  # A run of another event times. A change of the bench or its workflow times. Each failure of a step times, so a failure can skip no bench.
  # The job always runs, and it gives the output match of the gate: "Bench OK" names it as the job of changes, so a skip of the bench is a pass only when match is false.
  timed:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      match: ${{ steps.decide.outputs.match }}
    steps:
      - id: checkout
        if: github.event_name == 'pull_request' && needs.changes.outputs.match == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request' && needs.changes.outputs.match == 'true'
        continue-on-error: true
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: github.event_name == 'pull_request' && needs.changes.outputs.match == 'true'
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - id: install
        if: github.event_name == 'pull_request' && needs.changes.outputs.match == 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - id: decide
        if: ${{ !cancelled() }}
        uses: mark1russell7/template/.github/actions/stamp-gate@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          config: packages/stack-endurance/bench/stamp.json
          package: packages/stack-endurance
          changes: ${{ needs.changes.outputs.match }}
          install: ${{ steps.install.outcome }}
          always: |
            packages/stack-endurance/bench
            .github/workflows/bench.yml
            :(exclude)*.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: independent-bench-stamps
          path: ${{ runner.temp }}/stamps
          if-no-files-found: ignore

  bench:
    name: bench (run ${{ matrix.run }})
    needs: timed
    if: needs.timed.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    env:
      RUN: ${{ matrix.run }}
      # The commit that the job times: the head of a pull request, not its merge commit, so a frozen limit names a commit of the branch.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time each case in fresh children
        working-directory: packages/stack-endurance
        run: |
          node bench/main.ts run --out "$RUNNER_TEMP/bench" --job "$GITHUB_RUN_ID-$RUN" \
            --job-index "$RUN" --commit "$COMMIT" --run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: independent-bench-run${{ matrix.run }}
          path: ${{ runner.temp }}/bench
          if-no-files-found: error

  read:
    needs: [timed, bench]
    if: ${{ !cancelled() && needs.timed.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATE: ${{ github.event_name != 'workflow_dispatch' || inputs.gate }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: independent-bench-run*
          path: ${{ runner.temp }}/records
      # A job that failed gives no record, and the read shows each of its cases as a no read.
      - name: Read the gate and the candidate limits
        working-directory: packages/stack-endurance
        run: |
          mkdir -p "$RUNNER_TEMP/read"
          args=(read --in "$RUNNER_TEMP/records" --expect 6 --freeze "$RUNNER_TEMP/read/limits.candidate.json")
          if [ -f bench/limits.json ]; then args+=(--limits bench/limits.json); fi
          if [ "$GATE" = "true" ]; then args+=(--enforce); fi
          node bench/main.ts "${args[@]}" | tee "$RUNNER_TEMP/read/report.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: independent-bench-read
          path: ${{ runner.temp }}/read
          if-no-files-found: error

  bench-ok:
    name: Bench OK
    if: ${{ !cancelled() }}
    needs: [changes, timed, bench, read]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          needs: ${{ toJSON(needs) }}
          changes: timed
