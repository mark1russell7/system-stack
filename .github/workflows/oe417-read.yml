# The reader of the OE-417 annual summaries of DOE (public domain). A person starts it:
#   gh workflow run oe417-read.yml
# The job fetches the 24 archived files of OE417_FILES from the Internet Archive through polite-crawler, one request at a time.
# It compares the rows and the counts with OE417_YEARS and OE417_ATTACK_EVENTS, and it fails when they differ.
# It uploads the rows and the counts as the artifact oe417-read. For a new year, give the entries in the input extra.
name: oe417-read

on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'JSON of more summaries, for example a new year: {"2024":{"id":85,"format":"xls","url":"...","archive":"..."}} (empty for none)'
        type: string
        default: ""
      check:
        description: Compare the read with the dataset, and fail on a difference
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: oe417-read
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
      - name: Read the summaries
        env:
          EXTRA: ${{ inputs.extra }}
          CHECK: ${{ inputs.check }}
        run: |
          args=(--out out/oe417.json)
          if [ -n "$EXTRA" ]; then
            printf '%s' "$EXTRA" > "$RUNNER_TEMP/oe417-extra.json"
            args+=(--extra "$RUNNER_TEMP/oe417-extra.json")
          fi
          if [ "$CHECK" = "true" ]; then args+=(--check); fi
          node packages/stack-hazards/scripts/oe417-read.ts "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: oe417-read
          path: out/oe417.json
          retention-days: 90
          if-no-files-found: error
